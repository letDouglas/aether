apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: management-vault
  namespace: vso
spec:
  # The child cluster talks to the management cluster's internal DNS
  address: http://vault.vault.svc.cluster.local:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-auth
  namespace: vso
spec:
  method: kubernetes
  mount: aether-ml
  vaultConnectionRef: management-vault
  kubernetes:
    # This role MUST be created in the Management Vault for the aether-ml cluster
    role: ml-cluster-role 
    serviceAccount: vso-vault-secrets-operator-controller-manager