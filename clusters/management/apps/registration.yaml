apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-registration
  namespace: argocd
  annotations:
    # Must sync after CAPI clusters are deployed (which is on Wave 3)
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/letDouglas/aether.git
    targetRevision: dev
    path: clusters/management/capi-registration
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true