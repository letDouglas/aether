# Vault server configuration in standalone mode.
# Uses file-based storage for development portability. 
# UI is enabled to allow manual inspection during the lab lifecycle.
server:
  standalone:
    enabled: true
    config: |
      ui = true
      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
      }
      storage "file" {
        path = "/vault/data"
      }
  dataStorage:
    enabled: true
    size: 2Gi
  service:
    type: ClusterIP