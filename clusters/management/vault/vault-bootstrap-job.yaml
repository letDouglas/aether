# Job to automate Vault post-initialization tasks.
# This job runs once after the operator unseals Vault to establish the platform's
# security posture: enabling the KV-V2 engine, configuring the Kubernetes Auth
# method, and creating the necessary policies/roles for secret access.
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-bootstrap
  namespace: vault
spec:
  template:
    spec:
      containers:
        - name: vault-bootstrap
          image: hashicorp/vault:1.18.0
          env:
            - name: VAULT_ADDR
              value: http://vault.vault.svc.cluster.local:8200
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-root-token
                  key: token
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Vault API..."
              until vault status >/dev/null 2>&1; do sleep 2; done

              echo "Enabling KV-V2 Secrets Engine..."
              vault secrets enable -path=secret kv-v2 || true

              echo "Enabling Kubernetes Authentication Method..."
              vault auth enable kubernetes || true

              echo "Configuring Kubernetes Authentication Config..."
              vault write auth/kubernetes/config \
                kubernetes_host="https://kubernetes.default.svc"

              echo "Creating Aether Read-Only Policy..."
              vault policy write aether-policy - <<-EOF
              path "secret/data/aether/*" {
                capabilities = ["read"]
              }
              EOF

              # Policy allowing the bootstrap job to write the generated credentials
              echo "Creating Aether Write-Only Policy for Garage..."
              vault policy write aether-write-policy - <<-EOF
              path "secret/data/aether/garage" {
                capabilities = ["create", "update", "patch", "read"]
              }
              EOF

              echo "Creating Aether Kubernetes Role..."
              # Bind the ServiceAccount used by VSO to the aether-policy.
              vault write auth/kubernetes/role/vso-role \
                bound_service_account_names=vso-vault-secrets-operator-controller-manager \
                bound_service_account_namespaces="*" \
                policies=aether-policy \
                ttl=24h
                
              echo "Creating ML Cluster Kubernetes Role..."
              vault write auth/kubernetes/role/ml-cluster-role \
                bound_service_account_names=vso-vault-secrets-operator-controller-manager \
                bound_service_account_namespaces="vso" \
                policies=aether-policy \
                ttl=24h        

              # Role allowing the Garage Job to authenticate and write to Vault
              echo "Creating ML Garage Bootstrap Write Role..."
              vault write auth/kubernetes/role/ml-garage-bootstrap-role \
                bound_service_account_names=garage-bootstrap \
                bound_service_account_namespaces="garage" \
                policies=aether-write-policy \
                ttl=1h

              echo "Vault Bootstrap Configuration Successful."
              
      restartPolicy: OnFailure
