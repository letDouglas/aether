# ArgoCD configuration for Aether Management Cluster.
# Optimized for resource-constrained development environments (Kind).

global:
  logging:
    format: json
    level: info

configs:
  params:
    # Disable internal TLS to simplify local port-forwarding and Ingress tunneling.
    # SSL/TLS termination should be handled at the Ingress Controller layer.
    server.insecure: "true"

# Resource limits tuned for a single-node Kind cluster to ensure 
# ArgoCD remains stable without starving the Control Plane.
controller:
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

repoServer:
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

server:
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

redis:
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi