apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: management-root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/letDouglas/aether.git
    targetRevision: dev
    path: clusters/management/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true