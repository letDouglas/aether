# VSO Helm configuration.
# This chart deploys the Vault Secrets Operator (VSO) controller.
# The controller runs as a Kubernetes Operator (Deployment) that watches
# the API server for Vault-related custom resources and synchronizes secrets.

defaultVaultConnection:
  enabled: false

# Resource constraints for the VSO controller.
controller:
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
