# ==============================================================================
# This manifest automates the bridge between Cluster API (CAPI) and ArgoCD.
# It uses an ephemeral Job to extract auto-generated kubeconfigs from 
# target cluster namespaces and register them natively into ArgoCD.
# 
# Logic:
# 1. ServiceAccount/RBAC: Grants granular access to read CAPI secrets and 
#    write ArgoCD cluster secrets.
# 2. ArgoCD Hooks: Uses 'PostSync' to ensure registration triggers only after 
#    the base management infrastructure is successfully deployed.
# 3. Dynamic Registration: Automatically labels secrets for ArgoCD discovery.
# ==============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-registrar
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-registrar
rules:
# Required to fetch kubeconfig secrets from target namespaces and register them in argocd namespace
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-registrar
subjects:
- kind: ServiceAccount
  name: cluster-registrar
  namespace: argocd
roleRef:
  kind: ClusterRole
  name: cluster-registrar
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: register-clusters
  namespace: argocd
  annotations:
    # Ensure this runs only after the initial synchronization phase
    argocd.argoproj.io/hook: PostSync
    # Clean up the job automatically upon successful completion to keep the cluster tidy
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    # Execution wave ensures this runs after infrastructure provisioning
    argocd.argoproj.io/sync-wave: "5" 
spec:
  template:
    spec:
      serviceAccountName: cluster-registrar
      containers:
      - name: registrar
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          for cluster in "aether-ml" "aether-serving"; do
            echo "Registering cluster: $cluster"
            
            # 1. Retrieve the kubeconfig secret generated by the CAPI controller.
            # We target the specific secret name convention used by the CAPI provider.
            kubectl get secret ${cluster}-kubeconfig -n ${cluster} -o jsonpath='{.data.value}' | base64 -d > /tmp/kubeconfig
            
            # 2. Transform the kubeconfig into an ArgoCD-compliant Secret.
            # ArgoCD auto-discovers secrets in its own namespace if they possess the 
            # 'argocd.argoproj.io/secret-type=cluster' label.
            kubectl create secret generic ${cluster}-secret \
              --from-file=config=/tmp/kubeconfig \
              -n argocd --dry-run=client -o yaml | \
              kubectl label -f - --local -o yaml \
              --dry-run=client \
              -l argocd.argoproj.io/secret-type=cluster \
              -a name=${cluster} | \
              kubectl apply -f -
            
            echo "Cluster $cluster registered."
          done
      restartPolicy: OnFailure