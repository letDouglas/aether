# ==============================================================================
# This manifest defines the ServiceAccount, RBAC, and Job required to
# bridge Cluster API (CAPI) and ArgoCD. It automatically discovers newly
# provisioned CAPI clusters and registers them into ArgoCD by injecting
# the required cluster secrets into the 'argocd' namespace natively.
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-cluster-registrar
  namespace: argocd
---
# RBAC: Provides the necessary permissions to read secrets from CAPI-managed
# namespaces and write cluster registration secrets to the ArgoCD namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-cluster-registrar
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-cluster-registrar
subjects:
  - kind: ServiceAccount
    name: argocd-cluster-registrar
    namespace: argocd
roleRef:
  kind: ClusterRole
  name: argocd-cluster-registrar
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: register-capi-clusters
  namespace: argocd
  annotations:
    # Sync-wave 5 ensures this job executes only after the core CAPI infrastructure
    # and the target clusters have been successfully provisioned.
    argocd.argoproj.io/sync-wave: "5"
spec:
  template:
    spec:
      serviceAccountName: argocd-cluster-registrar
      containers:
        - name: registrar
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              for CLUSTER in "aether-ml" "aether-serving"; do
                # 1. PROVISIONING GATE: Ensure the CAPI controller has finished 
                # generating the kubeconfig secret before attempting to read it.
                echo "Waiting for CAPI to generate kubeconfig for ${CLUSTER}..."
                until kubectl get secret ${CLUSTER}-kubeconfig -n ${CLUSTER} >/dev/null 2>&1; do
                  sleep 5
                done
                
                # 2. EXTRACTION: Retrieve the raw kubeconfig from the CAPI namespace 
                # and decode the base64-encoded value for local processing.
                echo "Extracting kubeconfig certificates..."
                kubectl get secret ${CLUSTER}-kubeconfig -n ${CLUSTER} -o jsonpath='{.data.value}' | base64 -d > /tmp/kubeconfig
                
                # 3. PARAMETER PARSING & SANITIZATION: Extract connection strings and 
                # TLS credentials. The 'tr -d' command flattens the base64 strings by 
                # removing hidden carriage returns or newlines, preventing JSON syntax breakage.
                SERVER=$(kubectl --kubeconfig /tmp/kubeconfig config view --minify -o jsonpath='{.clusters[0].cluster.server}')
                CA_DATA=$(kubectl --kubeconfig /tmp/kubeconfig config view --minify --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | tr -d '\n\r')
                CERT_DATA=$(kubectl --kubeconfig /tmp/kubeconfig config view --minify --raw -o jsonpath='{.users[0].user.client-certificate-data}' | tr -d '\n\r')
                KEY_DATA=$(kubectl --kubeconfig /tmp/kubeconfig config view --minify --raw -o jsonpath='{.users[0].user.client-key-data}' | tr -d '\n\r')
                
                # 4. NATIVE DATA NORMALIZATION: Formulate the target TLS payload natively
                # using bash string interpolation to avoid external dependencies like 'jq'.
                JSON_CONFIG="{\"tlsClientConfig\":{\"insecure\":false,\"caData\":\"$CA_DATA\",\"certData\":\"$CERT_DATA\",\"keyData\":\"$KEY_DATA\"}}"
                
                # 5. DECLARATIVE REGISTRATION: Inject the ArgoCD-compatible secret.
                # Creates the secret struct natively, appends the mandatory discovery label 
                # locally, and pipes the final valid YAML directly into the API server.
                kubectl create secret generic cluster-${CLUSTER} -n argocd \
                  --from-literal=name="${CLUSTER}" \
                  --from-literal=server="${SERVER}" \
                  --from-literal=config="${JSON_CONFIG}" \
                  --dry-run=client -o yaml | \
                  kubectl label -f - --local -o yaml "argocd.argoproj.io/secret-type=cluster" | \
                  kubectl apply -f -
                
                echo "Successfully registered ${CLUSTER} in ArgoCD."
              done
      restartPolicy: OnFailure
