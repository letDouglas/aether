apiVersion: v1
kind: ServiceAccount
metadata:
  name: vso-client
  namespace: mlflow
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: management-vault
  namespace: mlflow
spec:
  address: http://vault.vault.svc.cluster.local:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-auth
  namespace: mlflow
spec:
  method: kubernetes
  mount: aether-ml
  vaultConnectionRef: management-vault
  kubernetes:
    role: ml-cluster-role
    serviceAccount: vso-client