apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mlflow-db-sync
  namespace: mlflow
spec:
  vaultAuthRef: vso-auth
  mount: secret
  path: aether/mlflow-db
  type: kv-v2
  destination:
    name: mlflow-db-creds
    create: true
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mlflow-s3-sync
  namespace: mlflow
spec:
  vaultAuthRef: vso-auth
  mount: secret
  path: aether/garage
  type: kv-v2
  destination:
    name: mlflow-s3-creds
    create: true