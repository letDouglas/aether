apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: management-vault
  namespace: garage
spec:
  address: http://vault.vault.svc.cluster.local:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vso-auth
  namespace: garage
spec:
  method: kubernetes
  mount: aether-ml
  vaultConnectionRef: management-vault
  kubernetes:
    role: ml-cluster-role
    serviceAccount: vso-vault-secrets-operator-controller-manager
    tokenAudiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: garage-secret-sync
  namespace: garage
spec:
  # Uses the VaultAuth configured in clusters/ml/vso/config.yaml
  vaultAuthRef: vso-auth
  mount: secret
  path: aether/garage
  type: kv-v2
  destination:
    name: garage-creds
    create: true
