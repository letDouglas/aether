garage:
  dbEngine: "sqlite"        # fix per ENOSYS/os error 38 su filesystem virtiofs/Mac
  replicationFactor: "1"
  s3:
    api:
      region: "us-east-1"   

deployment:
  replicaCount: 1

persistence:
  data:
    size: 10Gi
  meta:
    size: 1Gi

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m