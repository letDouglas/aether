garage:
  # Single-node, no replication for dev
  replicationFactor: "1"

s3:
  api:
    region: "us-east-1"

# Garage reads credentials from env vars injected by VSO
# Keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# (bootstrapped manually via `garage key create` after first deploy)
persistence:
  data:
    size: 10Gi
  meta:
    size: 1Gi

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m